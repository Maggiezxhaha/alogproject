epochs: 2
batch_size: 96
val_batch_size: 96
num_workers: 2
optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001
scheduler:
  name: steplr
  step_size: 30
  gamma: 0.1
monitor: val_accuracy
monitor_mode: max
train_split: train
val_split: test
seed: 42
amp: false
eval_after_train: false
